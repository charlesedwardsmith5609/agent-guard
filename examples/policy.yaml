# agent-guard example policy. Every key under tools, hosts and paths.allow is required;
# an empty list ([]) means "allow nothing".

# Tools the agent may call (exact, case-sensitive names). A trailing * is a prefix pattern
# (3+ characters), for MCP servers.
# This list is only a starting point: agents have other tools too, and anything not listed is
# blocked as tool-not-declared. Run your agent once, then read the tool names it tried from the
# audit log: jq -r 'select(.rule == "tool-not-declared") | .tool' audit.jsonl | sort | uniq -c
tools:
  - Read
  - Write
  - Edit
  - Glob
  - Grep
  - Bash
  - WebFetch
  - "mcp__github__*"

# Hosts tool calls may contact. "*.example.com" matches subdomains but not example.com itself.
# A host that is not listed is still allowed if the user's own messages mention it.
hosts:
  - github.com
  - "*.githubusercontent.com"
  - pypi.org
  - "*.pythonhosted.org"
  - registry.npmjs.org

paths:
  # Relative paths in tool arguments resolve against workdir (must be absolute or start with ~).
  workdir: ~/code/myproject
  # Structured path arguments (file_path, path, ...) must lie under one of these directories.
  allow:
    - ~/code/myproject
    - /tmp

# What to do when a call touches a sensitive location. ask (default) or block.
# These apply to any access, not only reads. Here: refuse /proc/<pid>/environ and the metadata
# endpoint outright, and ask about .ssh and .env files.
sensitive:
  proc_environ: block   # /proc/<pid>/environ
  ssh: ask              # any .ssh path
  dotenv: ask           # .env and .env.*
  metadata: block       # cloud metadata endpoint (169.254.169.254 and spellings)

# Optional canary tokens (16–256 bytes each). If a tool call's arguments contain one of these
# (or a sensitive path/host classification) and the call has an egress channel — any extracted
# host, or a message/forum-style tool — the call is BLOCKED as egress:canary /
# egress:sensitive:<class>. Plant a unique string in a deploy token / secret you care about.
# canaries:
#   - "AG_CANARY_DEPLOY_replace_me"
# Optional extra forum tool name patterns (exact or trailing *). Names are also matched by a
# built-in heuristic (send/post/message/…; create|update|add + issue|discussion|pr).
# forum_tools:
#   - "mcp__slack__*"
